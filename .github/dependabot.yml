version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "xunit*"
      - dependency-name: "Microsoft.NET.Test.Sdk"
      - dependency-name: "coverlet.*"
      - dependency-name: "Microsoft.Testing.*"
      - dependency-name: "Microsoft.Data.Sqlite"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci(deps)"
